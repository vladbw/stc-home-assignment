services:
  postgres:
    image: postgres:16
    container_name: sts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sts
      POSTGRES_PASSWORD: sts
      POSTGRES_DB: sts
    ports:
      - "5432:5432"
    volumes:
      - sts_pgdata:/var/lib/postgresql/data

volumes:
  sts_pgdata:
