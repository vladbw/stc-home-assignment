# Railway build + start for the backend workspace.
#
# Build phase:
#   1. install all workspaces (root npm install)
#   2. generate Prisma client (writes to node_modules/.prisma/client)
#   3. apply pending migrations against the live DATABASE_URL
#
# Runtime: tsx executes the backend source directly. Avoids the workspace
# build-output split we'd otherwise need because @sts/shared exports TS source.

[build]
buildCommand = "npm install && npm run db:generate -w backend && npm run prod:migrate -w backend"

[deploy]
startCommand = "npm run prod:start -w backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
